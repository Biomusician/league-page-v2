<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ league.display_name }} — {{ season }} {{ issue_key }}</title>
<style>
  :root { --ink:#1a1c20; --paper:#f7f6f2; --accent:#7a2318; --line:#d8d5cd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; background:var(--paper); color:var(--ink); line-height:1.55; }
  header { text-align:center; border-bottom:3px double var(--ink); padding:1.6rem 1rem .9rem; }
  header h1 { margin:0; font-size:2.4rem; letter-spacing:.12em; text-transform:uppercase; }
  header .sub { color:var(--accent); font-variant:small-caps; letter-spacing:.15em; }
  main { max-width:46rem; margin:0 auto; padding:1.5rem 1.2rem 4rem; }
  main h1, main h2 { border-bottom:1px solid var(--line); padding-bottom:.25rem; }
  main img, main table { max-width:100%; }
  table { border-collapse:collapse; }
  td, th { border:1px solid var(--line); padding:.3rem .5rem; }
  blockquote { border-left:3px solid var(--accent); margin-left:0; padding-left:1rem; color:#444; }
</style>
</head>
<body>
<header>
  <h1>{{ league.display_name }}</h1>
  <div class="sub">{{ league.subtitle }} · {{ season }}</div>
</header>
<main>
{{ body | safe }}
</main>
</body>
</html>
