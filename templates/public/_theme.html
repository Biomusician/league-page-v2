<style>
  * { box-sizing:border-box; }
  body { margin:0; line-height:1.55; }
  main { max-width:48rem; margin:0 auto; padding:1.5rem 1.2rem 4rem; }
  header.masthead { text-align:center; padding:1.8rem 1rem 1rem; }
  header.masthead h1 { margin:0; letter-spacing:.14em; text-transform:uppercase; }
  header.masthead .sub { font-variant:small-caps; letter-spacing:.18em; }
  nav.leaguenav { text-align:center; padding:.5rem 0 .9rem; font-size:.85rem; }
  nav.leaguenav a { margin:0 .55rem; text-decoration:none; }
  h2.section-label { text-transform:uppercase; letter-spacing:.12em; font-size:1.05rem; }
  .credit { font-variant:small-caps; letter-spacing:.08em; font-size:.85rem; }
  table { border-collapse:collapse; }
  td, th { padding:.3rem .6rem; text-align:left; }
  blockquote { margin-left:0; padding-left:1rem; }
  section.module { margin:2.2rem 0; }
{% if league.theme == "disco" %}
  /* DISCO CHAT — 606 ACS patch colours: indigo panel, patch gold for track
     symbology and section labels. Keep in step with public/_site_css.html.
     Restrained; a board, never a radar-screen costume. */
  body { background:#15142c; color:#e9e7f2; font-family: Georgia, 'Times New Roman', serif; }
  header.masthead { border-bottom:3px double #f0d848; }
  header.masthead h1 { font-size:2.5rem; color:#f0d848; }
  header.masthead .sub { color:#a9a6c8; }
  nav.leaguenav { border-bottom:1px solid #33325f; }
  nav.leaguenav a { color:#a9a6c8; }
  h2.section-label { color:#f0d848; border-left:6px solid #f0d848; padding-left:.6rem; }
  h2.section-label::before { content:"▸ "; color:#a9a6c8; }
  a { color:#f0d848; }
  section.module { border-top:1px solid #33325f; padding-top:.8rem; }
  .credit { color:#a9a6c8; }
  td, th { border:1px solid #33325f; }
  th { background:#1f1e40; color:#f0d848; }
  blockquote { border-left:3px solid #f0d848; color:#d5d1e6; }
{% else %}
  /* THE SURFEIT — Skunk Works insignia: black field, roundel-blue links,
     banner gold for rules and labels, assessment-document typography. Keep
     in step with the canonical theme in public/_site_css.html. */
  body { background:#0a0b0e; color:#eef1f5; font-family: Georgia, 'Times New Roman', serif; }
  header.masthead { border-bottom:3px solid #f0c419; }
  header.masthead h1 { font-size:2.5rem; color:#f0c419; }
  header.masthead .sub { color:#a3adba; }
  nav.leaguenav { border-bottom:1px solid #2a2f38; background:#050608; }
  nav.leaguenav a { color:#b6c2ce; }
  h2.section-label { color:#f0c419; border-bottom:2px solid #2a2f38; padding-bottom:.2rem; }
  h2.section-label::after { content: " ·"; color:#4da3e8; }
  a { color:#4da3e8; }
  section.module { }
  .credit { color:#a3adba; }
  td, th { border:1px solid #2a2f38; }
  th { background:#171b22; color:#f0c419; }
  blockquote { border-left:3px solid #4da3e8; color:#ccd5de; }
{% endif %}
</style>
