<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Commissioner's Desk{% endblock %}</title>
{#  The session's CSRF token, for desk.js to attach to every mutating
    request. Empty when auth is off, which is the mode the check itself
    short-circuits, so the page behaves identically either way. #}
<meta name="csrf-token" content="{{ request.state.session.csrf if request.state.session else '' }}">
<style>
  :root { --ink:#1a1c20; --paper:#f7f6f2; --accent:#7a2318; --muted:#6b6f76; --card:#ffffff; --line:#d8d5cd; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, 'Times New Roman', serif; background:var(--paper); color:var(--ink); }
  header.masthead { border-bottom:3px double var(--ink); padding:1rem 2rem; display:flex; justify-content:space-between; align-items:baseline; }
  header.masthead h1 { margin:0; font-size:1.4rem; letter-spacing:.08em; text-transform:uppercase; }
  header.masthead a { color:var(--accent); text-decoration:none; }
  main { max-width:70rem; margin:0 auto; padding:1.5rem 2rem 4rem; }
  h2 { border-bottom:1px solid var(--line); padding-bottom:.3rem; margin-top:2.2rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:.9rem 1.1rem; margin:.7rem 0; }
  .meta { color:var(--muted); font-size:.85rem; }
  .score { display:inline-block; min-width:2.2rem; text-align:center; background:var(--ink); color:var(--paper); border-radius:3px; padding:.05rem .3rem; font-family:monospace; }
  .facts { margin:.4rem 0 .2rem; padding-left:1.2rem; }
  .facts li { margin:.15rem 0; }
  form.inline { display:inline-flex; gap:.4rem; align-items:center; flex-wrap:wrap; margin-top:.4rem; }
  input[type=text], textarea, select { font:inherit; padding:.25rem .4rem; border:1px solid var(--line); border-radius:3px; }
  button, .btn { min-height:2.75rem; }
  @media (min-width:56rem) { button, .btn { min-height:0; } }
  button { font:inherit; padding:.25rem .8rem; border:1px solid var(--ink); background:var(--card); border-radius:3px; cursor:pointer; }
  button.primary, .btn.primary { background:var(--ink); color:var(--paper); }
  /* A link that looks and sizes like a button, for the places that
     used to wrap a real button inside an anchor: two focus stops for
     one control, and in some engines the button ate the click. */
  .btn { font:inherit; display:inline-block; padding:.25rem .8rem;
         border:1px solid var(--ink); background:var(--card);
         color:var(--ink); border-radius:3px; cursor:pointer;
         text-decoration:none; }
  .decision { font-weight:bold; color:var(--accent); }
  table { border-collapse:collapse; width:100%; }
  td, th { border:1px solid var(--line); padding:.3rem .5rem; text-align:left; }
  details summary { cursor:pointer; color:var(--muted); }
  .warn { background:#fff3cd; border:1px solid #e0c96a; padding:.5rem .8rem; border-radius:4px; }
  code { background:#eeece6; padding:0 .25rem; }
  th.sortable { cursor:pointer; }
  th.sortable::after { content:" ↕"; opacity:.45; font-size:.8em; }
  th.sortable[aria-sort="ascending"]::after { content:" ▲"; opacity:1; }
  th.sortable[aria-sort="descending"]::after { content:" ▼"; opacity:1; }
  /* sortable.js moves each header's text into a real button. Without this
     reset every sortable header renders as a grey UA button, which on the
     editor's team-name grid alone cost 42px of table width. The public
     stylesheet has carried this rule; the Desk never did. */
  th.sortable button { font:inherit; color:inherit; background:none; border:0;
                       padding:0; cursor:pointer; text-align:left; }
  /* The Desk had no focus styles at all and relied on the UA default. */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, summary:focus-visible
    { outline:3px solid var(--accent); outline-offset:2px; }
  /* Any input sized in characters overflows a phone. Let the container
     decide the width; `size` and `cols` stay as a fallback for no-CSS. */
  input[type=text], input[type=email], input[type=url], textarea, select
    { max-width:100%; }
  td input[type=text], td textarea, td select { width:100%; }
  /* Text under 16px makes iOS Safari zoom on focus and never zoom back,
     stranding the writer mid-sentence. Nothing typed into is below 1rem. */
  textarea, input, select { font-size:1rem; }
  /* desk.js puts every table in one of these, so a wide table scrolls in
     its own box instead of dragging the page sideways. */
  .tablewrap { overflow-x:auto; max-width:100%; }
  .tablewrap:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  @media (max-width: 40rem) {
    /* 64px of gutter is 17% of a 375px screen. Seventeen of the Desk's
       twenty-one templates had no responsive rule at all. */
    main { padding:1rem .7rem 3rem; }
    header.masthead { padding:.7rem .8rem; }
    form.inline { display:flex; }
  }
</style>
</head>
<body>
<header class="masthead">
  <h1><a href="/commissioner">Commissioner's Desk</a></h1>
  <div class="meta">{% block masthead_right %}{% endblock %}</div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="/static/sortable.js" defer></script>
<script src="/static/desk.js" defer></script>
</body>
</html>
